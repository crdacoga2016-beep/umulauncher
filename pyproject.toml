[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "umulauncher"
version = "1.0.0"
description = "Launcher ligero y moderno para juegos Windows en Linux mediante umu-run (umu-launcher) y Proton."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "umulaucher" },
]
keywords = ["umu", "umu-launcher", "proton", "wine", "gaming", "launcher", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Desktop Environment",
]
dependencies = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
umulauncher = "umulaucher:main"

[project.urls]
Homepage = "https://github.com/crdacoga2016-beep/umulauncher"

[tool.setuptools]
py-modules = ["umulaucher"]

[tool.setuptools.packages.find]
include = ["core*"]
